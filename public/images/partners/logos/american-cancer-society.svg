  <!-- Text: American Cancer Society -->
  <text x="48" y="30" font-family="'Libre Baskerville', Georgia, serif" font-size="20" font-weight="700" fill="#003A70" letter-spacing="-0.01em">American</text>
  <text x="48" y="52" font-family="'Libre Baskerville', Georgia, serif" font-size="20" font-weight="700" fill="#003A70" letter-spacing="-0.01em">Cancer Society<tspan font-family="Arial" font-size="12" dy="-8">®</tspan></text>
