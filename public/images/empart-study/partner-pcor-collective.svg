<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 116" width="260" height="116" role="img" aria-label="Partners in PCOR Community Health">
  <!-- Crisp Double Architectural Border -->
  <rect x="4" y="4" width="252" height="108" rx="4" fill="#ffffff" stroke="#a6362b" stroke-width="1.5"/>
  <rect x="9" y="9" width="242" height="98" rx="2" fill="none" stroke="#c96b59" stroke-width="0.9"/>

  <!-- Top Header -->
  <text x="130" y="29" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-style="italic" font-weight="700" font-size="14.5" fill="#9c2119">Partners in PCOR</text>

  <!-- Central Connected Figures Ring -->
  <g transform="translate(130, 58)">
    <!-- Top Figure (Blue) -->
    <circle cx="0" cy="-14" r="3.8" fill="#2563eb"/>
    <path d="M-8,-6 C-4,-11 4,-11 8,-6 C4,-2 -4,-2 -8,-6 Z" fill="#2563eb"/>
    <!-- Right Figure (Green) -->
    <circle cx="15" cy="0" r="3.8" fill="#16a34a"/>
    <path d="M7,-8 C12,-4 12,4 7,8 C3,4 3,-4 7,-8 Z" fill="#16a34a"/>
    <!-- Bottom Figure (Amber) -->
    <circle cx="0" cy="14" r="3.8" fill="#ea580c"/>
    <path d="M-8,6 C-4,11 4,11 8,6 C4,2 -4,2 -8,6 Z" fill="#ea580c"/>
    <!-- Left Figure (Crimson) -->
    <circle cx="-15" cy="0" r="3.8" fill="#dc2626"/>
    <path d="M-7,-8 C-12,-4 -12,4 -7,8 C-3,4 -3,-4 -7,-8 Z" fill="#dc2626"/>
  </g>

  <!-- Bottom Label -->
  <text x="130" y="96" text-anchor="middle" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.2" fill="#28587b">COMMUNITY HEALTH</text>
</svg>

